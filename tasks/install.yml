---

# Owned by root: the container runs as root with the container socket mounted, and the env file controls which API calls it lets through.
# Whoever owns the base path could rename the env file (even a root-owned one) and put another in its place.
- name: Ensure container-socket-proxy path exists
  ansible.builtin.file:
    path: "{{ container_socket_proxy_base_path }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ container_socket_proxy_gid }}"

- name: Ensure container-socket-proxy support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ container_socket_proxy_base_path }}/{{ item }}"
    mode: "0640"
    owner: root
    group: "{{ container_socket_proxy_gid }}"
  with_items:
    - env
    - labels
  register: container_socket_proxy_support_files_result

- name: Ensure container-socket-proxy container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ container_socket_proxy_container_image }}"
    pull: always
  register: container_socket_proxy_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: container_socket_proxy_container_image_pull_result_ansible_module is not failed

- name: Ensure container-socket-proxy container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ container_socket_proxy_container_image }}"
  register: container_socket_proxy_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: container_socket_proxy_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in container_socket_proxy_container_image_pull_result_command.stdout"

- name: Ensure container-socket-proxy container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ container_socket_proxy_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  until: container_socket_proxy_network_creation_result is not failed
  register: container_socket_proxy_network_creation_result

- name: Ensure container-socket-proxy container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ container_socket_proxy_container_network }}
  register: container_socket_proxy_network_creation_result
  changed_when: container_socket_proxy_network_creation_result.rc == 0
  failed_when: container_socket_proxy_network_creation_result.rc != 0 and 'already exists' not in container_socket_proxy_network_creation_result.stderr

- name: Ensure container-socket-proxy systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/container-socket-proxy.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ container_socket_proxy_identifier }}.service"
    mode: "0644"
  register: container_socket_proxy_systemd_service_result

- name: Ensure container-socket-proxy host socket systemd units are present
  when: container_socket_proxy_host_socket_forwarding_enabled | bool
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/{{ item.src }}"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ item.dest }}"
    mode: "0644"
  with_items:
    - src: container-socket-proxy-host-socket.socket.j2
      dest: "{{ container_socket_proxy_host_socket_forwarding_systemd_socket_name }}"
    - src: container-socket-proxy-host-socket.service.j2
      dest: "{{ container_socket_proxy_host_socket_forwarding_systemd_service_name }}"
  register: container_socket_proxy_host_socket_systemd_units_result

# The units are started along with the container-socket-proxy service, which requires the socket.
# Stopping the socket stops that service too, so that it starts again with the changed socket.
- name: Ensure container-socket-proxy host socket systemd units are stopped after changes
  when: container_socket_proxy_host_socket_systemd_units_result.changed | default(false)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  with_items:
    - "{{ container_socket_proxy_host_socket_forwarding_systemd_service_name }}"
    - "{{ container_socket_proxy_host_socket_forwarding_systemd_socket_name }}"

- name: Ensure container-socket-proxy host socket systemd units do not exist
  when: not container_socket_proxy_host_socket_forwarding_enabled | bool
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall_host_socket.yml"

- name: Determine whether container-socket-proxy needs a restart
  ansible.builtin.set_fact:
    container_socket_proxy_restart_necessary: >-
      {{
        container_socket_proxy_support_files_result.changed | default(false)
        or container_socket_proxy_systemd_service_result.changed | default(false)
        or container_socket_proxy_host_socket_systemd_units_result.changed | default(false)
        or container_socket_proxy_container_image_pull_result_ansible_module.changed | default(false)
        or container_socket_proxy_container_image_pull_result_command.changed | default(false)
      }}
